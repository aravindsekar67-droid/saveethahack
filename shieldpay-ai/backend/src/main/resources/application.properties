# Server Configuration
server.port=8080
server.servlet.context-path=/

# Primary Database Configuration (MySQL with env var overrides)
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/shieldpay?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ShieldPay Application Custom Properties
shieldpay.ai.api-key=${AI_API_KEY:}
shieldpay.ai.model=gpt-3.5-turbo
shieldpay.admin.email=${ADMIN_EMAIL:admin@shieldpay.ai}
shieldpay.admin.password=${ADMIN_PASSWORD:ShieldAdmin@2026}

# Logging
logging.level.com.shieldpay=INFO
logging.level.org.springframework.web=INFO
